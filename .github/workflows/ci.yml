name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  stable:
    name: stable — fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --release

      # No -C target-cpu=native here: runners differ, and the point of CI is to
      # prove the portable path. simd::attention's is_x86_feature_detected!
      # dispatch picks AVX2 only if the runner actually has it, and falls back
      # to the scalar tiled kernel otherwise. Native flags are for local benching.
      - name: cargo test
        run: cargo test --release

      # The AVX-512 module builds on stable since 1.89, so it belongs in the
      # blocking job rather than only in the advisory nightly one below —
      # otherwise it could break and nothing would fail. Whether the kernel
      # actually executes still depends on the runner; the dispatch feature-tests
      # at runtime and the correctness test skips itself when AVX-512F is absent.
      - name: cargo clippy (--cfg avx512)
        env:
          RUSTFLAGS: --cfg avx512
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (--cfg avx512)
        env:
          RUSTFLAGS: --cfg avx512
        run: cargo test --release

  nightly-avx512:
    name: nightly — toolchain drift check
    runs-on: ubuntu-latest
    # Advisory only: nightly toolchain drift must not block the repo.
    continue-on-error: true
    env:
      RUSTFLAGS: --cfg avx512
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      # The stable job above is what guards this code; this one is an early
      # warning that a nightly change is coming for it. Print the runner CPU so
      # a green check can be read correctly: with avx512f the kernel really ran,
      # without it only the fallback did.
      - name: runner AVX-512 support
        run: |
          # Note: `grep ... | sort || echo` would never reach the echo, since the
          # pipeline takes sort's exit status and sort succeeds on empty input.
          flags=$(grep -o 'avx512[a-z0-9]*' /proc/cpuinfo | sort -u | tr '\n' ' ')
          if [ -n "$flags" ]; then
            echo "runner HAS AVX-512 ($flags) — the kernel is executed by the tests below"
          else
            echo "runner has NO AVX-512 — the kernel is built and type-checked, but avx512_matches_naive will skip"
          fi

      - name: cargo build (--cfg avx512)
        run: cargo build --release

      # Sound either way: simd::attention's dispatch feature-tests at runtime, and
      # the avx512 correctness test skips itself when the CPU lacks AVX-512F
      # rather than invoking a kernel the hardware cannot run.
      - name: cargo test (--cfg avx512)
        run: cargo test --release
