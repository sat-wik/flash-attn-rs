name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  stable:
    name: stable — fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --release

      # No -C target-cpu=native here: runners differ, and the point of CI is to
      # prove the portable path. simd::attention's is_x86_feature_detected!
      # dispatch picks AVX2 only if the runner actually has it, and falls back
      # to the scalar tiled kernel otherwise. Native flags are for local benching.
      - name: cargo test
        run: cargo test --release

  nightly-avx512:
    name: nightly — avx512 build + test
    runs-on: ubuntu-latest
    # Advisory only: nightly toolchain drift must not block the repo.
    continue-on-error: true
    env:
      RUSTFLAGS: --cfg avx512
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      # Whether the AVX-512 kernel actually executes depends on the runner, and
      # GitHub does not guarantee a particular CPU. Print what we got, so a green
      # check can be read correctly: with avx512f the kernel really ran, without
      # it only the fallback did.
      - name: runner AVX-512 support
        run: grep -o 'avx512[a-z0-9]*' /proc/cpuinfo | sort -u || echo "none — kernel will be compiled but not executed"

      - name: cargo build (--cfg avx512)
        run: cargo build --release

      # Sound either way: simd::attention's dispatch feature-tests at runtime, and
      # the avx512 correctness test skips itself when the CPU lacks AVX-512F
      # rather than invoking a kernel the hardware cannot run.
      - name: cargo test (--cfg avx512)
        run: cargo test --release
