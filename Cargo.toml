[package]
name = "flash-attn-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Hand-optimized attention kernels in Rust: naive -> tiled (flash) -> AVX2 SIMD"

[lints.rust]
# `avx512` is an opt-in cfg, set via RUSTFLAGS="--cfg avx512" on nightly / 1.89+.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(avx512)'] }

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "attention"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
